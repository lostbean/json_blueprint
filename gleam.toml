name = "json_blueprint"
version = "2.0.0"
internal_modules = ["json/blueprint/internal", "json/blueprint/internal/*", "json/blueprint/codegen/internal", "json/blueprint/codegen/internal/*"]

description = "Simplify JSON encoding/decoding while automatically generating JSON schemas for your data types."
licences = ["MIT"]
repository = { type = "github", user = "lostbean", repo = "json_blueprint" }

[dependencies]
gleam_stdlib = ">= 0.60.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.3.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[[documentation.pages]]
title = "Migrating from 1.x"
path = "migration-2-0.html"
source = "./docs/MIGRATION.md"
